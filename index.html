<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>SkyGuard - God's Eye Tactique (Optimisé)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    /* --- DESIGN CYBERPUNK & TACTIQUE --- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #05070a; color: #00ff9d; font-family: 'JetBrains Mono', monospace, sans-serif; display: flex; height: 100vh; overflow: hidden; }
    
    #control-panel {
      width: 300px; background: rgba(13, 19, 34, 0.95); border-right: 2px solid #00ff9d;
      padding: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 15px;
      box-shadow: 5px 0 15px rgba(0, 255, 157, 0.1);
    }
    h2 { font-size: 1.1em; color: #00ff9d; border-bottom: 1px dashed #334155; padding-bottom: 8px; }
    
    .tactical-btn {
      width: 100%; padding: 10px; background: #0f172a; color: #38bdf8; border: 1px solid #334155;
      border-radius: 4px; cursor: pointer; font-weight: bold; text-align: left; transition: all 0.2s;
    }
    .tactical-btn:hover { background: #1e293b; border-color: #00ff9d; color: #00ff9d; }

    #map { flex: 1; height: 100vh; filter: brightness(0.9) contrast(1.1); }

    /* --- FENÊTRE MODULAIRE CAMÉRA --- */
    #media-modal {
      position: absolute; bottom: 20px; right: 20px; z-index: 1000; background: #080c14;
      border: 2px solid #00ff9d; border-radius: 6px; width: 320px; display: none;
      box-shadow: 0 0 20px rgba(0, 255, 157, 0.2);
    }
    .modal-header {
      background: #0f172a; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #334155; font-size: 0.8em; color: #00ff9d;
    }
    .modal-body { padding: 12px; font-size: 0.85em; color: #cbd5e1; text-align: center; }
    
    /* Indicateur de performance */
    #perf-badge { position: absolute; top: 15px; right: 15px; z-index: 1000; background: rgba(0,0,0,0.8); border: 1px solid #00ff9d; padding: 5px 10px; font-size: 0.75em; border-radius: 4px; color: #00ff9d; }
  </style>
</head>
<body>

  <!-- PANNEAU DE CONTRÔLE LOGIQUE -->
  <div id="control-panel">
    <h2>🛰️ SKYGUARD // OPS</h2>
    <div>
      <p style="font-size: 0.8em; color: #94a3b8; margin-bottom: 8px;">FILTRES DE CALQUES</p>
      <button class="tactical-btn" onclick="filterLayer('all')">🌍 Vue Globale (Tout)</button>
      <button class="tactical-btn" style="margin-top: 8px;" onclick="filterLayer('planes')">✈️ Avions Uniquement (ADS-B)</button>
      <button class="tactical-btn" style="margin-top: 8px;" onclick="filterLayer('ships')">🚢 Bateaux Uniquement (AIS)</button>
    </div>
    <div style="margin-top: auto; font-size: 0.75em; color: #64748b; border-top: 1px solid #1e293b; padding-top: 10px;">
      SYS.STATUS : OPTIMIZED<br>THINKPAD PROTECTED [OK]
    </div>
  </div>

  <!-- CARTE 2D LÉGÈRE (Anti-surchauffe) -->
  <div id="map"></div>

  <!-- BADGE DE PERFORMANCE -->
  <div id="perf-badge">FPS : 60 [STABLE]</div>

  <!-- FENÊTRE CAMÉRA MODULAIRE -->
  <div id="media-modal">
    <div class="modal-header">
      <span>🔴 FLUX TACTIQUE EN DIRECT</span>
      <button onclick="closeMediaModal()" style="background: none; border: none; color: #fff; cursor: pointer; font-weight: bold;">✕</button>
    </div>
    <div id="media-content" class="modal-body">
      Sélectionnez une cible sur la carte pour afficher le flux vidéo associé.
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Initialisation de la carte 2D ultra-rapide (zéro charge GPU lourde)
    const map = L.map('map', { zoomControl: false }).setView([48.8566, 2.3522], 7);

    // Fond de carte sombre tactique
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    function filterLayer(type) {
      console.log("Application du filtre : " + type);
      // Logique de bascule des flux à connecter ici
    }

    function closeMediaModal() {
      document.getElementById('media-modal').style.display = 'none';
    }

    // ADAPTIVE FPS : Ralentit les scripts si l'onglet est en arrière-plan pour épargner le CPU
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        console.log("Mode éco activé (Arrière-plan)");
      } else {
        console.log("Reprise des performances maximales");
      }
    });
  </script>
</body>
</html>
